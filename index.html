<title>Split View Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --canvas: #e7e9ec;
    --chrome: #f6f7f8;
    --chrome-raised: #ffffff;
    --line: #d6d9dd;
    --line-soft: #e3e5e8;
    --ink: #24262b;
    --ink-mute: #767c85;
    --ink-faint: #a4a9b0;
    --accent: #3b62f6;
    --accent-ink: #ffffff;
    --accent-soft: #e1e8ff;
    --accent-soft-line: #b9c8fe;
    --shadow: 0 12px 28px -12px rgba(20, 22, 30, 0.28);
    --radius-lg: 10px;
    --radius-md: 7px;
    --radius-sm: 5px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #17181b;
      --chrome: #202226;
      --chrome-raised: #26282d;
      --line: #35383e;
      --line-soft: #2b2e33;
      --ink: #e7e9ec;
      --ink-mute: #9a9fa7;
      --ink-faint: #64686f;
      --accent: #6f8dff;
      --accent-ink: #10131c;
      --accent-soft: #262d47;
      --accent-soft-line: #3c4a7c;
      --shadow: 0 14px 32px -14px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --canvas: #17181b;
    --chrome: #202226;
    --chrome-raised: #26282d;
    --line: #35383e;
    --line-soft: #2b2e33;
    --ink: #e7e9ec;
    --ink-mute: #9a9fa7;
    --ink-faint: #64686f;
    --accent: #6f8dff;
    --accent-ink: #10131c;
    --accent-soft: #262d47;
    --accent-soft-line: #3c4a7c;
    --shadow: 0 14px 32px -14px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    height: 100vh;
    padding: 10px;
    gap: 10px;
  }

  /* ---------- Sidebar ---------- */

  .sidebar {
    width: 248px;
    flex-shrink: 0;
    background: var(--chrome);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    padding: 12px 10px;
    gap: 10px;
    user-select: none;
  }

  .pinned-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .pinned-tab {
    aspect-ratio: 1;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chrome-raised);
    border: 1px solid var(--line-soft);
    cursor: default;
    font-size: 15px;
  }

  .pinned-tab svg { width: 17px; height: 17px; }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 2px 2px 0;
  }

  .section-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 2px 6px 0;
  }

  .tab-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: var(--radius-md);
    cursor: grab;
    position: relative;
    border: 1px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .tab:hover { background: var(--line-soft); }

  .tab.active {
    background: var(--chrome-raised);
    border-color: var(--line);
  }

  .tab.selected {
    background: var(--accent-soft);
    border-color: var(--accent-soft-line);
  }

  .tab.dragging { opacity: 0.35; }

  .tab.drop-target {
    background: var(--accent-soft);
    border-color: var(--accent-soft-line);
  }

  .tab.drop-target::before {
    content: "";
    position: absolute;
    top: 3px;
    bottom: 3px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .tab.drop-target.drop-side-left::before { left: 1px; }
  .tab.drop-target.drop-side-right::before { right: 1px; }

  .tab-split {
    padding: 4px;
    gap: 0;
  }

  .split-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 5px;
    border-radius: calc(var(--radius-md) - 2px);
    flex: 1;
    min-width: 0;
  }

  .split-chip:hover { background: var(--line-soft); }

  .split-chip .favicon { width: 17px; height: 17px; font-size: 9px; border-radius: 4px; }

  .split-chip-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  .split-chip-close {
    width: 15px;
    height: 15px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .split-chip-close:hover { background: var(--line); color: var(--ink); }
  .split-chip-close svg { width: 8px; height: 8px; }

  .split-divider {
    width: 1px;
    align-self: stretch;
    background: var(--line);
    margin: 2px 1px;
    flex-shrink: 0;
  }

  .tab-check {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1.5px solid var(--ink-faint);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }

  .tab.selectable .tab-check { opacity: 1; }
  .tab.selected .tab-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab.selected .tab-check svg { display: block; }
  .tab-check svg { display: none; width: 9px; height: 9px; stroke: var(--accent-ink); }

  .favicon {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
  }

  .tab-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .hint {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    line-height: 1.5;
    padding: 8px 6px 2px;
    border-top: 1px solid var(--line);
  }
  .hint b { color: var(--ink-mute); }

  /* ---------- Viewport ---------- */

  .viewport {
    flex: 1;
    position: relative;
    display: flex;
    gap: 8px;
    min-width: 0;
  }

  .pane {
    flex: 1;
    min-width: 0;
    background: var(--chrome-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pane-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }

  .pane-bar .favicon { width: 16px; height: 16px; font-size: 8px; border-radius: 4px; }

  .pane-url {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-mute);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pane-close {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .pane-close:hover { background: var(--line-soft); color: var(--ink); }
  .pane-close svg { width: 10px; height: 10px; }

  .pane-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
  }

  .pane-page .favicon-big {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 26px;
    font-weight: 600;
    color: #fff;
  }

  .pane-page .page-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .pane-page .page-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .page-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    pointer-events: none;
  }

  /* ---------- Drag ghost ---------- */

  .drag-ghost {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px 7px 8px;
    background: var(--chrome-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    font-size: 12.5px;
    font-weight: 600;
    transform: translate(14px, 10px) rotate(-2deg);
    max-width: 240px;
  }
  .drag-ghost .favicon { width: 17px; height: 17px; font-size: 9px; flex-shrink: 0; }
  .drag-ghost > div:last-child {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Drop overlay ---------- */

  .drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 20;
    pointer-events: none;
  }

  .drop-half {
    flex: 1;
    margin: 8px;
    border-radius: var(--radius-lg);
    border: 2px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }

  .drop-half.armed {
    opacity: 1;
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .drop-half.dim { opacity: 0.35; }

  .drop-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ---------- Context menu ---------- */

  .ctx-menu {
    position: fixed;
    z-index: 200;
    background: var(--chrome-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 4px;
    min-width: 176px;
    display: none;
    flex-direction: column;
  }
  .ctx-menu.open { display: flex; }

  .ctx-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .ctx-item:hover { background: var(--accent-soft); color: var(--accent); }
  .ctx-item svg { width: 13px; height: 13px; flex-shrink: 0; }
  .ctx-item.disabled { color: var(--ink-faint); cursor: default; }
  .ctx-item.disabled:hover { background: none; color: var(--ink-faint); }

  /* ---------- Toast ---------- */

  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--canvas);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 300;
    font-family: "IBM Plex Mono", monospace;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="pinned-row">
      <div class="pinned-tab" title="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8804a" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </div>
      <div class="pinned-tab" title="Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.3-1 2.3-2.1 3v2.5h3.4c2-1.8 3.1-4.5 3.1-7.4z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.5c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.6C4.4 19.6 7.9 22 12 22z"/><path fill="#FBBC05" d="M6.2 13.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.3H2.7C2 8.7 1.6 10.3 1.6 12s.4 3.3 1.1 4.7l3.5-3z"/><path fill="#EA4335" d="M12 5.8c1.5 0 2.9.5 4 1.5l3-3C17.2 2.5 14.8 1.6 12 1.6 7.9 1.6 4.4 4 2.7 7.3l3.5 2.6c.8-2.5 3.1-4.1 5.8-4.1z"/></svg>
      </div>
      <div class="pinned-tab" title="Gmail">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M2 6.5v11c0 .8.7 1.5 1.5 1.5H5V8.1L12 13l7-4.9V19h1.5c.8 0 1.5-.7 1.5-1.5v-11c0-1-1.1-1.6-2-1L12 10.5 3.9 5.5c-.8-.5-1.9.1-1.9 1z"/></svg>
      </div>
      <div class="pinned-tab" title="Notion">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#000"/><text x="12" y="16.5" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#fff">N</text></svg>
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Tabs</div>
    <div class="tab-list" id="tabList"></div>

    <div class="hint">
      <b>drag</b> a tab into the page &rarr; split &nbsp;·&nbsp;
      <b>&#8984;/ctrl</b>-click to multi-select &rarr; right-click &rarr; split
    </div>
  </div>

  <div class="viewport" id="viewport"></div>
</div>

<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" id="ctxSplit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
    Open as split
  </div>
  <div class="ctx-item disabled" id="ctxSplitHint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
    Open (select 2 tabs)
  </div>
  <div class="ctx-item" id="ctxSeparate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>
    Separate tabs
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var TABS = [
    { id: "t1", name: "Figma — Split View Spec", color: "#8b5cf6", letter: "F", url: "figma.com/file/split-view" },
    { id: "t2", name: "GitHub — open PRs", color: "#24292f", letter: "G", url: "github.com/pulls" },
    { id: "t3", name: "Linear — Sprint 24", color: "#5e6ad2", letter: "L", url: "linear.app/sprint-24" },
    { id: "t4", name: "Vercel — preview build", color: "#0f0f10", letter: "V", url: "vercel.com/deployments" },
    { id: "t5", name: "Stripe — Dashboard", color: "#635bff", letter: "S", url: "dashboard.stripe.com" },
    { id: "t6", name: "Amplitude — Retention", color: "#0071e3", letter: "A", url: "amplitude.com/retention" }
  ];

  var byId = {};
  TABS.forEach(function (t) { byId[t.id] = t; });

  var state = {
    activeId: "t1",
    selected: new Set(),
    splitGroup: null,      // [leftId, rightId] — persists as a unit until separated
    viewMode: "single",    // "single" | "split" — which is currently shown in the viewport
    dragTabId: null         // id of the tab currently being pointer-dragged, if any
  };

  var sidebarEl = document.getElementById("sidebar");
  var tabListEl = document.getElementById("tabList");
  var viewportEl = document.getElementById("viewport");
  var ctxMenu = document.getElementById("ctxMenu");
  var ctxSplitItem = document.getElementById("ctxSplit");
  var ctxSplitHint = document.getElementById("ctxSplitHint");
  var ctxSeparateItem = document.getElementById("ctxSeparate");
  var toastEl = document.getElementById("toast");
  var ctxMenuMode = "select"; // "select" | "split-row"

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function faviconEl(tab, cls) {
    var d = document.createElement("div");
    d.className = "favicon" + (cls ? " " + cls : "");
    d.style.background = tab.color;
    d.textContent = tab.letter;
    return d;
  }

  // ---------------- Sidebar tab list ----------------

  function renderTabList() {
    tabListEl.innerHTML = "";

    var mergedAtIdx = null;
    if (state.splitGroup) {
      var i0 = TABS.findIndex(function (t) { return t.id === state.splitGroup[0]; });
      var i1 = TABS.findIndex(function (t) { return t.id === state.splitGroup[1]; });
      mergedAtIdx = Math.min(i0, i1);
    }

    TABS.forEach(function (tab, idx) {
      if (state.splitGroup && state.splitGroup.indexOf(tab.id) !== -1) {
        if (idx !== mergedAtIdx) return; // the other half renders inside the merged row
        tabListEl.appendChild(buildSplitRow(state.splitGroup[0], state.splitGroup[1]));
        return;
      }
      tabListEl.appendChild(buildTabRow(tab));
    });
  }

  function buildSplitRow(idA, idB) {
    var row = document.createElement("div");
    row.className = "tab tab-split";
    if (state.viewMode === "split") row.classList.add("active");

    row.appendChild(buildSplitChip(idA, idB));
    var divider = document.createElement("div");
    divider.className = "split-divider";
    row.appendChild(divider);
    row.appendChild(buildSplitChip(idB, idA));

    row.addEventListener("click", function () {
      state.viewMode = "split";
      renderAll();
    });

    row.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      openCtxMenu(e.clientX, e.clientY, "split-row");
    });

    return row;
  }

  function unmergeSplit() {
    if (!state.splitGroup) return;
    state.activeId = state.splitGroup[0];
    state.splitGroup = null;
    state.viewMode = "single";
    renderAll();
    showToast("Tabs separated");
  }

  function buildSplitChip(id, otherId) {
    var tab = byId[id];
    var chip = document.createElement("div");
    chip.className = "split-chip";
    chip.appendChild(faviconEl(tab));

    var name = document.createElement("div");
    name.className = "split-chip-name";
    name.textContent = tab.name;
    chip.appendChild(name);

    var close = document.createElement("button");
    close.className = "split-chip-close";
    close.title = "Remove from split";
    close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>';
    close.addEventListener("click", function (e) {
      e.stopPropagation();
      separateFromSplit(otherId);
    });
    chip.appendChild(close);

    return chip;
  }

  function separateFromSplit(keepId) {
    state.splitGroup = null;
    state.viewMode = "single";
    state.activeId = keepId;
    renderAll();
  }

  function buildTabRow(tab) {
      var row = document.createElement("div");
      row.className = "tab";
      row.dataset.id = tab.id;

      if (tab.id === state.activeId && state.viewMode === "single") row.classList.add("active");
      if (state.selected.size > 0) row.classList.add("selectable");
      if (state.selected.has(tab.id)) row.classList.add("selected");

      var check = document.createElement("div");
      check.className = "tab-check";
      check.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke-width="2" stroke-linecap="round"><path d="M1.5 5.2l2.3 2.3 4.7-5"/></svg>';
      check.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleSelect(tab.id);
      });

      var fav = faviconEl(tab);
      var name = document.createElement("div");
      name.className = "tab-name";
      name.textContent = tab.name;

      row.appendChild(check);
      row.appendChild(fav);
      row.appendChild(name);

      row.addEventListener("click", function (e) {
        if (state.selected.size > 0) {
          toggleSelect(tab.id);
          return;
        }
        state.activeId = tab.id;
        state.viewMode = "single";
        renderAll();
      });

      row.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        if (!state.selected.has(tab.id) && state.selected.size < 2) {
          state.selected.add(tab.id);
          renderTabList();
        }
        openCtxMenu(e.clientX, e.clientY);
      });

      row.addEventListener("mousedown", function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey) return;
        if (e.target.closest(".tab-check")) return;
        beginPotentialDrag(e, tab.id, row);
      });

      return row;
  }

  function toggleSelect(id) {
    if (state.selected.has(id)) {
      state.selected.delete(id);
    } else {
      if (state.selected.size >= 2) {
        var first = state.selected.values().next().value;
        state.selected.delete(first);
      }
      state.selected.add(id);
    }
    renderTabList();
  }

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && !e.repeat) {
      sidebarEl.dataset.multiHint = "1";
    }
  });

  sidebarEl.addEventListener("click", function (e) {
    var onTab = e.target.closest(".tab");
    if (!onTab && !e.metaKey && !e.ctrlKey) {
      state.selected.clear();
      renderTabList();
    }
  });

  document.addEventListener("mousedown", function (e) {
    if (!e.target.closest(".tab") && (e.metaKey || e.ctrlKey)) return;
  });

  // cmd/ctrl+click support directly on the row (in addition to checkbox)
  tabListEl.addEventListener("mousedown", function (e) {
    var row = e.target.closest(".tab");
    if (!row) return;
    if (e.metaKey || e.ctrlKey) {
      e.preventDefault();
      toggleSelect(row.dataset.id);
    }
  });

  // ---------------- Viewport / panes ----------------

  function renderViewport() {
    viewportEl.innerHTML = "";

    if (state.viewMode !== "split" || !state.splitGroup) {
      viewportEl.appendChild(makePane(byId[state.activeId], false));
    } else {
      viewportEl.appendChild(makePane(byId[state.splitGroup[0]], true, state.splitGroup[1]));
      viewportEl.appendChild(makePane(byId[state.splitGroup[1]], true, state.splitGroup[0]));
    }

    // drop overlay only in single-pane mode, while dragging
    if (state.viewMode !== "split") {
      var overlay = document.createElement("div");
      overlay.className = "drop-overlay";
      overlay.id = "dropOverlay";

      var leftHalf = document.createElement("div");
      leftHalf.className = "drop-half";
      leftHalf.id = "dropLeft";
      leftHalf.innerHTML = '<div class="drop-label">' + arrowSvg("left") + "Drop left</div>";

      var rightHalf = document.createElement("div");
      rightHalf.className = "drop-half";
      rightHalf.id = "dropRight";
      rightHalf.innerHTML = '<div class="drop-label">Drop right' + arrowSvg("right") + "</div>";

      overlay.appendChild(leftHalf);
      overlay.appendChild(rightHalf);
      viewportEl.appendChild(overlay);
    }
  }

  function arrowSvg(dir) {
    var d = dir === "left" ? "M12 19l-7-7 7-7M5 12h14" : "M12 5l7 7-7 7M19 12H5";
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  }

  function makePane(tab, closable, otherId) {
    var pane = document.createElement("div");
    pane.className = "pane";

    var bar = document.createElement("div");
    bar.className = "pane-bar";
    bar.appendChild(faviconEl(tab));
    var url = document.createElement("div");
    url.className = "pane-url";
    url.textContent = tab.url;
    bar.appendChild(url);

    if (closable) {
      var close = document.createElement("button");
      close.className = "pane-close";
      close.title = "Remove from split";
      close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>';
      close.addEventListener("click", function () {
        separateFromSplit(otherId);
      });
      bar.appendChild(close);
    }

    var page = document.createElement("div");
    page.className = "pane-page";
    var grid = document.createElement("div");
    grid.className = "page-grid";
    var favBig = document.createElement("div");
    favBig.className = "favicon-big";
    favBig.style.background = tab.color;
    favBig.textContent = tab.letter;
    var nameEl = document.createElement("div");
    nameEl.className = "page-name";
    nameEl.textContent = tab.name;
    var meta = document.createElement("div");
    meta.className = "page-meta";
    meta.textContent = "wireframe placeholder · " + tab.url;

    page.appendChild(grid);
    page.appendChild(favBig);
    page.appendChild(nameEl);
    page.appendChild(meta);

    pane.appendChild(bar);
    pane.appendChild(page);
    return pane;
  }

  function clearDropOverlay() {
    var l = document.getElementById("dropLeft");
    var r = document.getElementById("dropRight");
    if (l) { l.classList.remove("armed", "dim"); }
    if (r) { r.classList.remove("armed", "dim"); }
  }

  // ---------------- Custom pointer-drag (cursor-following ghost) ----------------
  //
  // Native HTML5 drag-and-drop can't render a live, styled ghost that tracks the
  // cursor, so tab dragging is driven by mouse events instead: a small movement
  // threshold after mousedown arms the drag, a floating ghost element tracks the
  // pointer, and elementFromPoint on every move decides what's being hovered.

  var drag = null; // { tabId, ghostEl, sourceRow, overRow, overViewport, side }
  var suppressNextClick = false;

  document.addEventListener("click", function (e) {
    if (suppressNextClick) {
      suppressNextClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  function beginPotentialDrag(downEvent, tabId, sourceRow) {
    var startX = downEvent.clientX, startY = downEvent.clientY;
    var moved = false;

    function onMove(e) {
      if (!moved) {
        if (Math.abs(e.clientX - startX) < 4 && Math.abs(e.clientY - startY) < 4) return;
        moved = true;
        startDrag(tabId, sourceRow, e);
      }
      e.preventDefault();
      updateDragGhost(e.clientX, e.clientY);
      updateDropTargets(e.clientX, e.clientY);
    }

    function onUp(e) {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      if (moved) {
        suppressNextClick = true;
        finishDrag(e.clientX, e.clientY);
      }
    }

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  function startDrag(tabId, sourceRow, e) {
    state.dragTabId = tabId;
    drag = { tabId: tabId, sourceRow: sourceRow, overRow: null, overViewport: false, side: null };
    sourceRow.classList.add("dragging");
    document.body.style.userSelect = "none";
    document.body.style.cursor = "grabbing";

    var t = byId[tabId];
    var ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    var fav = faviconEl(t);
    var label = document.createElement("div");
    label.textContent = t.name;
    ghost.appendChild(fav);
    ghost.appendChild(label);
    document.body.appendChild(ghost);
    drag.ghostEl = ghost;
    updateDragGhost(e.clientX, e.clientY);
  }

  function updateDragGhost(x, y) {
    if (!drag || !drag.ghostEl) return;
    drag.ghostEl.style.left = x + "px";
    drag.ghostEl.style.top = y + "px";
  }

  function updateDropTargets(x, y) {
    if (!drag) return;
    var el = document.elementFromPoint(x, y);

    if (drag.overRow) {
      drag.overRow.classList.remove("drop-target", "drop-side-left", "drop-side-right");
      drag.overRow = null;
    }
    drag.overViewport = false;
    drag.side = null;

    var rowEl = el && el.closest(".tab[data-id]");
    if (rowEl && rowEl.dataset.id && rowEl.dataset.id !== drag.tabId) {
      var rowRect = rowEl.getBoundingClientRect();
      var rowSide = (x - rowRect.left) / rowRect.width < 0.5 ? "left" : "right";
      rowEl.classList.add("drop-target", rowSide === "left" ? "drop-side-left" : "drop-side-right");
      drag.overRow = rowEl;
      drag.side = rowSide;
      clearDropOverlay();
      return;
    }

    if (state.viewMode !== "split" && el && el.closest("#viewport")) {
      var rect = viewportEl.getBoundingClientRect();
      var side = (x - rect.left) / rect.width < 0.5 ? "left" : "right";
      drag.overViewport = true;
      drag.side = side;
      var l = document.getElementById("dropLeft");
      var r = document.getElementById("dropRight");
      if (l && r) {
        if (side === "left") {
          l.classList.add("armed"); l.classList.remove("dim");
          r.classList.remove("armed"); r.classList.add("dim");
        } else {
          r.classList.add("armed"); r.classList.remove("dim");
          l.classList.remove("armed"); l.classList.add("dim");
        }
      }
      return;
    }

    clearDropOverlay();
  }

  function finishDrag(x, y) {
    var d = drag;
    var handled = false;

    if (d.overRow) {
      var otherId = d.overRow.dataset.id;
      state.splitGroup = d.side === "left" ? [d.tabId, otherId] : [otherId, d.tabId];
      state.viewMode = "split";
      state.selected.clear();
      handled = true;
      showToast("Split view — " + byId[state.splitGroup[0]].name.split(" —")[0] + " / " + byId[state.splitGroup[1]].name.split(" —")[0]);
    } else if (d.overViewport && d.tabId !== state.activeId) {
      state.splitGroup = d.side === "left" ? [d.tabId, state.activeId] : [state.activeId, d.tabId];
      state.viewMode = "split";
      state.selected.clear();
      handled = true;
      showToast("Split view — " + byId[state.splitGroup[0]].name.split(" —")[0] + " / " + byId[state.splitGroup[1]].name.split(" —")[0]);
    }

    cleanupDrag();
    if (handled) renderAll();
  }

  function cleanupDrag() {
    if (!drag) return;
    if (drag.ghostEl) drag.ghostEl.remove();
    if (drag.sourceRow) drag.sourceRow.classList.remove("dragging");
    if (drag.overRow) drag.overRow.classList.remove("drop-target", "drop-side-left", "drop-side-right");
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    clearDropOverlay();
    state.dragTabId = null;
    drag = null;
  }

  // ---------------- Context menu ----------------

  function openCtxMenu(x, y, mode) {
    ctxMenuMode = mode || "select";
    ctxMenu.classList.add("open");
    ctxSplitItem.style.display = ctxMenuMode === "split-row" ? "none" : "flex";
    ctxSplitHint.style.display = ctxMenuMode === "split-row" ? "none" : "flex";
    ctxSeparateItem.style.display = ctxMenuMode === "split-row" ? "flex" : "none";
    var w = 190, h = ctxMenuMode === "split-row" ? 40 : 78;
    var vw = window.innerWidth, vh = window.innerHeight;
    ctxMenu.style.left = Math.min(x, vw - w - 8) + "px";
    ctxMenu.style.top = Math.min(y, vh - h - 8) + "px";
    updateCtxState();
  }

  function closeCtxMenu() {
    ctxMenu.classList.remove("open");
  }

  function updateCtxState() {
    var ready = state.selected.size === 2;
    ctxSplitItem.classList.toggle("disabled", !ready);
  }

  ctxSplitItem.addEventListener("click", function () {
    if (state.selected.size !== 2) return;
    var ids = Array.from(state.selected);
    state.splitGroup = ids;
    state.viewMode = "split";
    state.selected.clear();
    closeCtxMenu();
    renderAll();
    showToast("Split view — " + byId[ids[0]].name.split(" —")[0] + " / " + byId[ids[1]].name.split(" —")[0]);
  });

  ctxSeparateItem.addEventListener("click", function () {
    closeCtxMenu();
    unmergeSplit();
  });

  document.addEventListener("click", function (e) {
    if (!ctxMenu.contains(e.target)) closeCtxMenu();
  });
  document.addEventListener("contextmenu", function (e) {
    if (!e.target.closest(".tab")) closeCtxMenu();
  });
  window.addEventListener("scroll", closeCtxMenu, true);

  // ---------------- Render ----------------

  function renderAll() {
    renderTabList();
    renderViewport();
  }

  renderAll();
})();
</script>
